// Apply the java-library plugin to add support for Java Library
apply plugin: 'java-library'

// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
}

dependencies {
    // SFTP
    implementation 'com.hierynomus:sshj:0.38.0'

    // Modern look-and-feel
    implementation 'com.formdev:flatlaf:3.4'
    // FlatSVGIcon (vector toolbar icons) — not in flatlaf core
    implementation 'com.formdev:flatlaf-extras:3.4'


    // FTP/FTPS
    implementation 'commons-net:commons-net:3.11.1'

    // Syntax highlighting editor
    implementation 'com.fifesoft:rsyntaxtextarea:3.5.3'

    // JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // Native keyring (macOS Keychain, Windows Credential Manager, Linux Secret Service)
    implementation 'com.github.javakeyring:java-keyring:1.0.4'

    // S3
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:s3-transfer-manager'
    // Default S3 HTTP clients (already pulled transitively) — declared so we can compile against
    // their ProxyConfiguration to route S3 through the system proxy.
    implementation 'software.amazon.awssdk:apache-client'
    implementation 'software.amazon.awssdk:netty-nio-client'

    // Test framework
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.apache.sshd:sshd-core:2.12.0'
    testImplementation 'org.apache.sshd:sshd-sftp:2.12.0'
    testImplementation 'com.adobe.testing:s3mock-junit5:4.11.0'
    testImplementation 'software.amazon.awssdk:s3:2.46.7'
    testImplementation 'org.mockftpserver:MockFtpServer:3.1.0'
    testImplementation 'org.assertj:assertj-swing-junit:3.17.1'
}

// Skip UI tests with -PexcludeUI or when RELAYSFTP_SKIP_UI_TESTS env var is set
def skipUITests = project.hasProperty('excludeUI') ||
    System.getenv('RELAYSFTP_SKIP_UI_TESTS') != null

// Shared setup for every test task (unit/integration and UI alike).
// `headless`: the unit/integration task runs with java.awt.headless=true so it behaves the same
// on a CI runner with no display as on a developer desktop; only the UI tasks need a real one.
def configureAppTest = { Test t, boolean headless ->
    t.forkEvery = 1

    // Tests use the throwaway dev data folder (build/dev-data) — the same one `run` and
    // scripts/build-and-run.sh use — so they never read or write the real
    // ~/Library/Application Support/RelaySFTP. Override with -PdataDir=/some/path.
    def devDataDir = project.hasProperty('dataDir')
        ? file(project.property('dataDir'))
        : layout.buildDirectory.dir('dev-data').get().asFile
    t.doFirst { devDataDir.mkdirs() }
    t.systemProperty 'relaysftp.dataDir', devDataDir.absolutePath

    // Tests get an in-memory java.util.prefs backend - GSFTPPreferences must never
    // read/write the real ~/Library/Preferences store the installed app uses.
    t.systemProperty 'java.util.prefs.PreferencesFactory',
        'com.gideonsoftworks.testsupport.InMemoryPreferencesFactory'

    t.jvmArgs(
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.desktop/javax.swing=ALL-UNNAMED',
        '--enable-native-access=ALL-UNNAMED',
        '-Drelaysftp.keyring.disabled=true',
        // Silent accept-once host-key policy so SFTP test servers connect without a
        // TOFU dialog; tests that exercise the prompt inject their own via setPromptForTesting.
        '-Drelaysftp.sftp.hostkey.policy=accept-once',
        '-Djava.awt.headless=' + headless
    )
}

// `test` = everything except @Tag("ui"). Fast, safe to run while you work.
test {
    useJUnitPlatform {
        excludeTags 'ui'
        // Benchmarks (@Tag("perf")) print numbers rather than assert; opt in with -PincludePerf.
        if (!project.hasProperty('includePerf')) excludeTags 'perf'
    }
    configureAppTest(delegate, true)
}

// `uiTest` = the assertj-swing suite (@Tag("ui")): drives the real desktop with a robot, one
// class per JVM, strictly sequential. Part of `check`/`build`; skipped with -PexcludeUI or
// RELAYSFTP_SKIP_UI_TESTS. Results land in build/test-results/uiTest/.
tasks.register('uiTest', Test) {
    description = 'Runs the assertj-swing UI tests (@Tag("ui")). Needs an active desktop.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ui' }
    configureAppTest(delegate, false)
    maxParallelForks = 1
    shouldRunAfter tasks.named('test')
    onlyIf { !skipUITests }
}
// Retry net for the UI suite: `uiTest` records failures instead of failing the build, and
// `uiTestRetry` re-runs ONLY the classes that failed, each in a fresh JVM (new window, robot,
// server, temp dir). It fails the build if they fail again. Every retried class is printed and
// written to ui-flake/retried.txt, so a build that only passed on retry is visible, not silent.
tasks.named('uiTest', Test) { ignoreFailures = true }

def failedUiClasses = {
    def dir = layout.buildDirectory.dir('test-results/uiTest').get().asFile
    if (!dir.isDirectory()) return [] as Set
    def failed = [] as Set
    dir.listFiles({ f -> f.name.endsWith('.xml') } as FileFilter).each { f ->
        def suite = new groovy.xml.XmlSlurper().parse(f)
        suite.testcase.each { tc ->
            if (tc.failure.size() > 0 || tc.error.size() > 0) failed << tc.'@classname'.text()
        }
    }
    failed
}

tasks.register('uiTestRetry', Test) {
    description = 'Re-runs only the UI test classes that failed in uiTest, each in a fresh JVM.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ui' }
    configureAppTest(delegate, false)
    maxParallelForks = 1
    mustRunAfter tasks.named('uiTest')
    outputs.upToDateWhen { false }
    onlyIf { !skipUITests && !failedUiClasses().isEmpty() }
    doFirst {
        def classes = failedUiClasses()
        classes.each { filter.includeTestsMatching(it) }
        logger.lifecycle("RETRYING UI CLASSES (failed in uiTest): ${classes.join(', ')}")
    }
    doLast {
        def classes = failedUiClasses()   // uiTest's results are untouched; this is the retried list
        def out = file('ui-flake/retried.txt')
        out.parentFile.mkdirs()
        out.text = classes.join('\n') + '\n'
        logger.lifecycle("RETRIED UI CLASSES: ${classes.join(', ')} (see ui-flake/retried.txt)")
    }
}
tasks.named('check') { dependsOn 'uiTest', 'uiTestRetry' }

jar {
    // Keep the fat jar name unversioned so `java -jar build/libs/RelaySFTP.jar` stays valid
    // even though the project now carries a version.
    archiveFileName = 'RelaySFTP.jar'
    manifest {
        attributes 'Main-Class': 'com.gideonsoftworks.Gideon',
                   'Implementation-Version': project.version,
                   // Grant FlatLaf's native lib access on `java -jar` (JDK 24+ honors this manifest attribute),
                   // silencing the "restricted method ... System::load" warning and future-proofing the launch.
                   'Enable-Native-Access': 'ALL-UNNAMED'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// Build number for the About box: git commit count — monotonic, nothing to bump by hand.
// "dev" when git is unavailable (e.g. building from a source tarball).
def gitBuildNumber() {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, projectDir)
        def out = proc.text.trim()
        proc.waitFor()
        if (proc.exitValue() == 0 && !out.isEmpty()) return out
    } catch (Exception ignored) {}
    return 'dev'
}
def appBuildNumber = gitBuildNumber()

// Inject the project version + build number into the localized About-box string so the UI
// can't drift from the build/installer version. Scoped to the one file so binary resources
// are untouched.
processResources {
    inputs.property 'version', project.version
    inputs.property 'buildNumber', appBuildNumber
    filesMatching('I8LN/GideonStrings.properties') {
        filter(org.apache.tools.ant.filters.ReplaceTokens,
            tokens: [appVersion: project.version.toString(), appBuild: appBuildNumber])
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava.options.encoding = 'UTF-8'
compileJava.options.compilerArgs << '-Xlint:none'

// Run the app for development with an isolated data folder, so dev runs never
// touch the real ~/Library/Application Support/RelaySFTP (or platform equivalent).
// Usage: ./gradlew run    (override the folder with -PdataDir=/some/path)
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Run RelaySFTP with a throwaway dev data folder (build/dev-data)'
    mainClass = 'com.gideonsoftworks.Gideon'
    classpath = sourceSets.main.runtimeClasspath
    def devDataDir = project.hasProperty('dataDir')
        ? file(project.property('dataDir'))
        : layout.buildDirectory.dir('dev-data').get().asFile
    doFirst { devDataDir.mkdirs() }
    systemProperty 'relaysftp.dataDir', devDataDir.absolutePath
    // Grant FlatLaf's native lib access (silences the System::load restricted-method warning).
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // macOS: let the native title bar / scrollbars follow the system light/dark appearance.
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
        systemProperty 'apple.awt.application.appearance', 'system'
}

// --- jpackage native installer ---

def appVersion = project.version.toString()

// Collect runtime JARs into a staging directory for jpackage --input
tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('jpackage-libs')
}

// Copy the thin application JAR alongside dependencies
tasks.register('copyAppJar', Copy) {
    dependsOn jar
    from jar.archiveFile
    into layout.buildDirectory.dir('jpackage-libs')
}

tasks.register('jpackage', Exec) {
    dependsOn copyDependencies, copyAppJar
    group = 'distribution'
    description = 'Build a native installer using jpackage'

    def inputDir = layout.buildDirectory.dir('jpackage-libs').get().asFile
    def outputDir = layout.buildDirectory.dir('jpackage-out').get().asFile
    def resourceDir = file('src/main/resources/I8LN')
    def os = org.gradle.internal.os.OperatingSystem.current()

    doFirst {
        outputDir.mkdirs()
    }

    executable = 'jpackage'

    args = [
        '--input', inputDir.absolutePath,
        '--dest', outputDir.absolutePath,
        '--name', 'RelaySFTP',
        '--main-jar', jar.archiveFileName.get(),
        '--main-class', 'com.gideonsoftworks.Gideon',
        '--app-version', appVersion,
        '--vendor', 'Grey Horse Software',
        '--description', 'RelaySFTP - FTP/SFTP/S3 File Transfer Client',
        '--java-options', '-Xmx512m',
        '--java-options', '--add-opens=java.desktop/sun.awt.X11=ALL-UNNAMED',
        '--java-options', '--enable-native-access=ALL-UNNAMED',          // grant FlatLaf's native lib access (silences System::load warning)
        '--java-options', '-Dapple.awt.application.appearance=system',   // macOS: native title bar follows system appearance (ignored elsewhere)
    ]

    // Default type is app-image (fast, for dev). Override with: ./gradlew jpackage -PjpackageType=dmg
    def defaultType = 'app-image'
    def pkgType = project.hasProperty('jpackageType') ? project.property('jpackageType') : defaultType

    // macOS signing identity (Developer ID Application certificate name)
    // Set via: -PmacSigningIdentity="Developer ID Application: Your Name (TEAMID)"
    // or env: MAC_SIGNING_IDENTITY
    def macSignId = project.hasProperty('macSigningIdentity')
        ? project.property('macSigningIdentity')
        : System.getenv('MAC_SIGNING_IDENTITY')

    if (os.isMacOsX()) {
        args += [
            '--icon', new File(resourceDir, 'relaysftp.icns').absolutePath,
            '--type', pkgType,
            '--mac-package-name', 'RelaySFTP',
        ]
        if (macSignId) {
            args += [
                '--mac-sign',
                '--mac-signing-key-user-name', macSignId,
            ]
        }
    } else if (os.isWindows()) {
        args += [
            '--icon', new File(resourceDir, 'relaysftp.ico').absolutePath,
            '--type', pkgType,
        ]
        if (pkgType != 'app-image') {
            args += [
                '--win-dir-chooser',
                '--win-menu',
                '--win-shortcut',
            ]
        }
    } else {
        // Linux
        args += [
            '--icon', new File(resourceDir, 'relaysftp.png').absolutePath,
            '--type', pkgType,
        ]
        if (pkgType != 'app-image') {
            args += [
                '--linux-shortcut',
            ]
        }
    }

    // Copy .desktop file into app-image on Linux
    if (!os.isMacOsX() && !os.isWindows() && pkgType == 'app-image') {
        doLast {
            copy {
                from 'src/main/resources/linux/RelaySFTP.desktop'
                into outputDir.absolutePath + '/RelaySFTP/lib'
            }
        }
    }
}

// --- macOS notarization ---
// Submits the .dmg or .pkg to Apple for notarization.
// Requires: Apple ID, app-specific password, and team ID.
//   -PappleId="you@example.com"
//   -PappleTeamId="TEAMID"
//   or env: APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password in keychain)
tasks.register('notarizeMac', Exec) {
    dependsOn jpackage
    group = 'distribution'
    description = 'Notarize the macOS installer with Apple'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isMacOsX() }

    def outputDir = layout.buildDirectory.dir('jpackage-out').get().asFile
    def appleId = project.hasProperty('appleId')
        ? project.property('appleId') : System.getenv('APPLE_ID')
    def teamId = project.hasProperty('appleTeamId')
        ? project.property('appleTeamId') : System.getenv('APPLE_TEAM_ID')
    def appPassword = project.hasProperty('appleAppPassword')
        ? project.property('appleAppPassword') : System.getenv('APPLE_APP_PASSWORD')

    doFirst {
        // Find the .dmg or .pkg file
        def installer = fileTree(outputDir).matching {
            include '*.dmg', '*.pkg'
        }.singleFile

        commandLine 'xcrun', 'notarytool', 'submit',
            installer.absolutePath,
            '--apple-id', appleId,
            '--team-id', teamId,
            '--password', appPassword,
            '--wait'
    }
}

// Staple the notarization ticket to the installer
tasks.register('stapleMac', Exec) {
    dependsOn notarizeMac
    group = 'distribution'
    description = 'Staple notarization ticket to macOS installer'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isMacOsX() }

    def outputDir = layout.buildDirectory.dir('jpackage-out').get().asFile

    doFirst {
        def installer = fileTree(outputDir).matching {
            include '*.dmg', '*.pkg'
        }.singleFile

        commandLine 'xcrun', 'stapler', 'staple', installer.absolutePath
    }
}

// --- Windows code signing ---
// Signs the .exe or .msi with signtool.
// Requires: signtool.exe on PATH, certificate in Windows cert store.
//   -PwinCertName="Your Certificate CN"
//   or env: WIN_CERT_NAME
//   -PwinTimestampUrl="http://timestamp.digicert.com" (optional, defaults to DigiCert)
//   or env: WIN_TIMESTAMP_URL
tasks.register('signWindows', Exec) {
    dependsOn jpackage
    group = 'distribution'
    description = 'Sign the Windows installer with signtool'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }

    def outputDir = layout.buildDirectory.dir('jpackage-out').get().asFile
    def certName = project.hasProperty('winCertName')
        ? project.property('winCertName') : System.getenv('WIN_CERT_NAME')
    def timestampUrl = project.hasProperty('winTimestampUrl')
        ? project.property('winTimestampUrl')
        : (System.getenv('WIN_TIMESTAMP_URL') ?: 'http://timestamp.digicert.com')

    doFirst {
        def installer = fileTree(outputDir).matching {
            include '*.exe', '*.msi'
        }.singleFile

        commandLine 'signtool', 'sign',
            '/n', certName,
            '/t', timestampUrl,
            '/fd', 'SHA256',
            '/v',
            installer.absolutePath
    }
}

// Convenience: build + sign for each platform
tasks.register('packageSigned') {
    group = 'distribution'
    description = 'Build and sign the native installer for the current platform'
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isMacOsX()) {
        dependsOn stapleMac
    } else if (os.isWindows()) {
        dependsOn signWindows
    } else {
        dependsOn jpackage
    }
}
