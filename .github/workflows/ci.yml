name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # The assertj-swing UI suite needs a real desktop and is a local pre-merge check, not a CI gate.
    - name: Build and run unit + integration tests
      run: ./gradlew clean build -x uiTest -x uiTestRetry --no-daemon

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          build/reports/tests/**
          build/test-results/**
        if-no-files-found: ignore

    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: RelaySFTP-jar
        path: build/libs/RelaySFTP.jar
